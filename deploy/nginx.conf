# ── DeepResearch Nginx 反向代理配置 ──────────────
# 适用于 Docker Compose 部署，配合 Let's Encrypt 使用
# 使用时替换 example.com 为你的实际域名

upstream deepresearch {
    server deepresearch:8764;
}

# ── HTTP → HTTPS 强制跳转 ─────────────────────
server {
    listen 80;
    server_name example.com;   # ← 改成你的域名

    # Let's Encrypt 验证目录（certbot 自动写入）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 服务 ────────────────────────────────
server {
    listen 443 ssl http2;
    server_name example.com;   # ← 改成你的域名

    # SSL 证书（由 certbot/setup.sh 自动生成）
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── IP 级别限流（第二道防线，配合后端 RateLimiter）──
    limit_req_zone $binary_remote_addr zone=research:10m rate=6r/m;
    limit_req zone=research burst=3 nodelay;
    limit_req_status 429;

    # ── 静态文件（CSS/JS）— 直接由 Nginx 高效返回 ──
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── SSE 流式 API — 禁用缓冲 ────────────────
    location /api/v1/research/stream {
        proxy_pass http://deepresearch;

        # SSE 关键：不缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长连接超时（SSE 可能持续几分钟）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 传递真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 其他 API + 首页 ────────────────────────
    location / {
        proxy_pass http://deepresearch;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
